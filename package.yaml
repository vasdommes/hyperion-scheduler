name: hyperion-scheduler
version: '0.2.0.0'
author:
- Vasiliy Dommes
- David Simmons-Duffin
maintainer: vasdommes@gmail.com
license: MIT
language: GHC2021

ghc-options:
- -Wall
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints
- -O2
- -Wunused-packages
- -Wno-x-partial
- -Werror=missing-fields

library:
  source-dirs: src
  dependencies:
  - aeson
  - array
  - base
  - binary
  - binaryhash
  - bootstrap-build
  - bytestring
  - concurrency
  - containers
  - deepseq
  - directory
  - disk-free-space
  - distributed-process
  - distributed-process-async
  - distributed-process-client-server
  - distributed-process-extras
  - exceptions
  - extra
  - file-io
  - hyperion
  - min-max-pqueue
  - monoidal-containers
  - mtl
  - os-string
  - pqueue
  - stm
  - strict-concurrency
  - text
  - time
  - unix
  - vector

executables:
  hyperion-scheduler-test:
    main: Main.hs
    source-dirs: test/src
    dependencies:
    - aeson
    - base
    - binary
    - bootstrap-build
    - concurrent-output
    - directory
    - hyperion
    - hyperion-scheduler
    - matrix
    - mtl
    - optparse-applicative
    - vector
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

tests:
  hyperion-scheduler-unit-test:
    main: Main.hs
    source-dirs: test/unit
    dependencies:
    - aeson
    - base
    - binary
    - bootstrap-build
    - containers
    - directory
    - exceptions
    - filepath
    - hyperion
    - hyperion-scheduler
    - text
    - time
    ghc-options: -threaded
